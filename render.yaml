# One-click deploy on Render (New > Blueprint, pick this repo).
services:
  - type: web
    name: huddle
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: MAX_PER_ROOM
        value: "8"
      - key: TURN_URL
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
      # Cloudflare TURN relay (free tier): lets calls connect on networks that block direct links.
      - key: TURN_KEY_ID
        sync: false
      - key: TURN_KEY_API_TOKEN
        sync: false
      # Postgres database for accounts and saved chats (e.g. a free Neon database).
      - key: DATABASE_URL
        sync: false
